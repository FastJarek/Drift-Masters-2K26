<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Omijaj przeszkody</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "DejaVu Sans", system-ui, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #15231a;
        color: #f0f5f1;
        display: flex;
        justify-content: center;
      }

      main {
        width: min(480px, 100%);
        padding: 16px 12px 24px;
        box-sizing: border-box;
        text-align: center;
      }

      h1 {
        font-size: 1.4rem;
        margin: 0 0 12px;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        touch-action: none;
      }

      .sterowanie {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-top: 14px;
      }

      .sterowanie button {
        width: 88px;
        height: 56px;
        border: 0;
        border-radius: 10px;
        background: #2f6b3c;
        color: white;
        font-size: 1.6rem;
        cursor: pointer;
        touch-action: none;
        user-select: none;
      }

      .sterowanie button:active {
        background: #3f8a50;
      }

      .podpis {
        font-size: 0.85rem;
        color: #b9c9bd;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Omijaj przeszkody</h1>
      <canvas id="gra" width="480" height="720">
        Twoja przeglądarka nie obsługuje canvas.
      </canvas>
      <div class="sterowanie">
        <button id="lewo" type="button" aria-label="Jedź w lewo">◀</button>
        <button id="prawo" type="button" aria-label="Jedź w prawo">▶</button>
      </div>
      <p class="podpis">
        Strzałki lub A/D albo przyciski powyżej. Kolizja kosztuje życie.<br />
        R, Enter lub Spacja – restart po przegranej.
      </p>
    </main>
    <script src="gra-browser.js"></script>
  </body>
</html>
